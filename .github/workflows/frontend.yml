name: Frontend CI/CD  

on:  
  push:  
    branches: ["krisdev"]  
    paths:  
      - "frontend/**"  
  pull_request:  
    branches: ["krisdev"]  
    paths:  
      - "frontend/**"  

permissions: 
  contents: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: frontend

jobs:  
  build-and-push:  
    runs-on: ubuntu-latest  

    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  

      - name: Read and bump version  
        id: version  
        run: |  
          VERSION=$(cat VERSION | tr -d ' \n\r[:space:]')  
          IFS='.' read -r major minor patch <<< "$VERSION"  
          patch=$((patch+1))  
          NEW_VERSION="$major.$minor.$patch"  
          echo -n "$NEW_VERSION" > VERSION  
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV  

      - name: Commit new version  
        uses: stefanzweifel/git-auto-commit-action@v5  
        with:  
          commit_message: "chore: bump version to ${{ env.VERSION }}"  
          file_pattern: VERSION  

      - name: Log in to Docker Hub  
        uses: docker/login-action@v3  
        with:  
          username: ${{ secrets.DOCKERHUB_USERNAME }}  
          password: ${{ secrets.DOCKERHUB_TOKEN }} 
        
         

      - name: Build frontend image  
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ env.VERSION }} ./frontend  

      - name: Push frontend image  
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ env.VERSION }}