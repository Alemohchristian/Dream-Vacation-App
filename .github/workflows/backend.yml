name: Backend CI/CD  

on:  
  push:  
    branches: ["krisdev"]  
    paths:  
      - "backend/**"  
  pull_request:  
    branches: ["krisdev"]  
    paths:  
      - "backend/**"  

permissions: 
  contents: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: alemohchristian/backend

jobs:  
  build-test-and-push:  
    runs-on: ubuntu-latest

    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  

      - name: Set up Node.js  
        uses: actions/setup-node@v4  
        with:  
          node-version: 18  

      - name: Install dependencies  
        working-directory: ./backend  
        run: npm install  

      - name: Run tests  
        working-directory: ./backend  
        run: npm test  

      - name: Read and bump version  
        id: version  
        run: |  
          VERSION=$(cat VERSION)  
          IFS='.' read -r major minor patch <<< "$VERSION"  
          patch=$((patch+1))  
          NEW_VERSION="$major.$minor.$patch"  
          echo $NEW_VERSION > VERSION  
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV  

      - name: Commit new version  
        uses: stefanzweifel/git-auto-commit-action@v5  
        with:  
          commit_message: "chore: bump version to ${{ env.VERSION }}"  
          file_pattern: VERSION  

      - name: Log in to Docker Hub  
        uses: docker/login-action@v3  
        with:  
          username: ${{ secrets.DOCKERHUB_USERNAME }}  
          password: ${{ secrets.DOCKERHUB_TOKEN }}  
    

      - name: Build backend image  
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/dream-backend:${{ env.VERSION }} ./backend  

      - name: Push backend image  
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/dream-backend:${{ env.VERSION }}