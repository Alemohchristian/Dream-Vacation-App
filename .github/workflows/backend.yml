name: Build and Push Backend

on:
  push:
    branches:
      - krisdev

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set commit SHA as version
        run: echo "VERSION=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and push backend image
        run: |
          export DOCKER_BUILDKIT=0
          echo "🚀 Building backend image..."
          docker build --no-cache --progress=plain -t ${{ secrets.DOCKERHUB_USERNAME }}/dream-backend:${VERSION} ./backend
          
          echo "📤 Pushing backend image..."
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/dream-backend:${VERSION}

      - name: Finish backend job
        run: echo "✅ Backend build and push completed"
