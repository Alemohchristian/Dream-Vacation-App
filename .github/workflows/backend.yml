name: Build and Push Backend

on:
  push:
    branches:
      - krisdev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set version
        run: echo "VERSION=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Disable BuildKit
        run: export DOCKER_BUILDKIT=0

      - name: Build and push backend image
        run: |
          echo "🚀 Building backend image..."
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/dream-backend:${VERSION} ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/dream-backend:${VERSION}
