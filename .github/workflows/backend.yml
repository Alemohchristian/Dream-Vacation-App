name: Backend CI/CD  

on:  
  push:  
    branches: ["krisdev"]  
    paths:  
      - "backend/**"  
  pull_request:  
    branches: ["krisdev"]  
    paths:  
      - "backend/**"  

permissions: 
  contents: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: alemohchristian/backend 

jobs:  
  build-test-and-push:  
    runs-on: ubuntu-latest

    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  

      - name: Set up Node.js  
        uses: actions/setup-node@v4  
        with:  
          node-version: 18  

      - name: Install dependencies  
        working-directory: ./backend  
        run: npm install  

      - name: Run tests  
        working-directory: ./backend  
        run: npm test  

      - name: Read and bump version  
        id: version  
        run: |  
          VERSION=$(cat VERSION)  
          IFS='.' read -r major minor patch <<< "$VERSION"  
          patch=$((patch+1))  
          NEW_VERSION="$major.$minor.$patch"  
          echo $NEW_VERSION > VERSION  
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV  

      - name: Commit new version  
        uses: stefanzweifel/git-auto-commit-action@v5  
        with:  
          commit_message: "chore: bump version to ${{ env.VERSION }}"  
          file_pattern: VERSION  
          branch: krisdev  

      - name: Log in to Docker Hub (with retry)  
        run: |  
          for i in {1..5}; do  
            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}" ${{ env.REGISTRY }} && break  
            echo "Login failed, retrying in 10s..."  
            sleep 10  
          done  

      - name: Build backend image  
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.VERSION }} ./backend  

      - name: Push backend image  
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.VERSION }}