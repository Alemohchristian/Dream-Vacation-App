
services:
  backend:
    build: ./backend
    container_name: dream-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: dream-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
